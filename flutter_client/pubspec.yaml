name: intyx_dynamic_widget
description: >-
  AI-driven, JSON-configured dynamic widget system for Flutter.
  16 built-in widget types (Banner, Carousel, Countdown, Poll, Rating …),
  responsive layout, dismissible support, and an action callback system.
  Designed for server-driven UI via an AI agent backend.
version: 0.1.2
homepage: https://intyx.dev
repository: https://github.com/bmnova/intyx-dynamic-widget
issue_tracker: https://github.com/bmnova/intyx-dynamic-widget/issues
funding:
  - https://intyx.dev/pricing
topics:
  - widget
  - dynamic-ui
  - json
  - ai
  - server-driven-ui

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  cloud_firestore: ^5.0.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - lib/catalog/
